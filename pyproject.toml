[project]
name = "trafilanews"
version = "0.1.0"
description = "Trafilanews helps researchers stream news articles from RSS feeds including Google news. The library builds on Trafilatura, feedparser, and google news decoder."
authors = [
    {name = "Albin Touma",email = "albin.touma@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "googlenewsdecoder (>=0.1.7,<0.2.0)",
    "feedparser (>=6.0.14,<7.0.0)",
    "trafilatura (>=2.2.0,<3.0.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "playwright (>=1.63.0,<2.0.0)",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.63.0,<2.0.0",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
